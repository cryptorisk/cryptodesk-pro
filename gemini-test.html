<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Gemini Test</title>
<style>
body{font-family:monospace;background:#0a0a0a;color:#0f0;padding:20px;}
button{background:#c6f135;color:#000;border:none;padding:14px 28px;border-radius:8px;cursor:pointer;font-weight:700;font-size:16px;}
pre{background:#111;border:1px solid #333;border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-all;font-size:13px;margin-top:15px;min-height:100px;}
</style>
</head>
<body>
<h2>🤖 Gemini API Test</h2>
<button onclick="test()">TEST GEMINI</button>
<pre id="out">Click to test...</pre>

<script>
const KEY = "AQ.Ab8RN6LRykxWAbOTb8ZqTcDZn3OT4gcMYIEVy5BwbtRS8HyiBQ";
const URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent";

async function test(){
  const out = document.getElementById('out');
  out.textContent = '▶ Calling Gemini...\n';
  try{
    const resp = await fetch(URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-goog-api-key': KEY
      },
      body: JSON.stringify({
        contents: [{ parts: [{ text: "Say hello in 3 words" }] }]
      })
    });
    out.textContent += 'HTTP Status: ' + resp.status + '\n';
    const data = await resp.json();
    out.textContent += '\nFull response:\n' + JSON.stringify(data, null, 2);
    
    if(data.candidates && data.candidates[0]){
      out.textContent += '\n\n✅ SUCCESS: ' + data.candidates[0].content.parts[0].text;
    }
    if(data.error){
      out.textContent += '\n\n❌ ERROR: ' + data.error.message;
    }
  }catch(e){
    out.textContent += '\n💥 EXCEPTION: ' + e.message;
  }
}
</script>
</body>
</html>
