<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Auth Test v2</title>
<style>
body{font-family:monospace;background:#0a0a0a;color:#e0e0e0;padding:20px;}
button{background:#c6f135;color:#000;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:700;margin:5px;font-size:15px;display:block;width:100%;margin-bottom:10px;}
input{background:#1a1a2e;color:#e0e0e0;border:1px solid #444;padding:10px;border-radius:6px;width:100%;margin:6px 0;font-size:14px;box-sizing:border-box;}
pre{background:#111;border:1px solid #333;border-radius:8px;padding:14px;white-space:pre-wrap;word-break:break-all;font-size:13px;min-height:80px;color:#0f0;}
label{font-size:11px;color:#888;letter-spacing:1px;}
</style>
</head>
<body>
<h2>🔧 Auth Test v2</h2>

<label>EMAIL</label>
<input id="email" type="email" value="test999@gmail.com">
<label>PASSWORD</label>
<input id="pass" type="password" value="test123456">

<br>
<button onclick="doSignup()">▶ TEST SIGNUP</button>
<button onclick="doLogin()">▶ TEST LOGIN</button>

<label>RESULT:</label>
<pre id="out">waiting...</pre>

<script>
// Unregister any service workers first
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>r.unregister());
    document.getElementById('out').textContent += '\n[SW] All service workers unregistered';
  });
}

const SUPABASE_URL = "https://jqtawulzhfmierbnckuz.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxdGF3dWx6aGZtaWVyYm5ja3V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0MDM2MjksImV4cCI6MjA5Njk3OTYyOX0.3IHI8eFsupfLBgBKjbgXOyCWplrd3daPH-2DX8UISAE";

function log(msg){ document.getElementById('out').textContent += '\n' + msg; }
function clearLog(){ document.getElementById('out').textContent = ''; }

async function doSignup(){
  clearLog();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  log('▶ Calling /auth/v1/signup ...');
  log('Email: ' + email);
  
  try{
    const res = await fetch(SUPABASE_URL + '/auth/v1/signup', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ email, password: pass })
    });
    
    log('HTTP Status: ' + res.status + ' ' + res.statusText);
    const json = await res.json();
    log('Response:\n' + JSON.stringify(json, null, 2));
    
    if(json.id) log('\n✅ USER CREATED! id=' + json.id);
    if(json.error) log('\n❌ ERROR: ' + json.error + ' — ' + json.msg);
    if(json.message) log('\n⚠️ MESSAGE: ' + json.message);
    
  }catch(e){
    log('💥 FETCH FAILED: ' + e.message);
    log('(Network error or CORS)');
  }
}

async function doLogin(){
  clearLog();
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  log('▶ Calling /auth/v1/token ...');
  
  try{
    const res = await fetch(SUPABASE_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY
      },
      body: JSON.stringify({ email, password: pass })
    });
    
    log('HTTP Status: ' + res.status);
    const json = await res.json();
    log('Response:\n' + JSON.stringify(json, null, 2));
    
    if(json.access_token) log('\n✅ LOGIN OK!');
    if(json.error) log('\n❌ ERROR: ' + json.error + ' — ' + json.error_description);
    
  }catch(e){
    log('💥 FETCH FAILED: ' + e.message);
  }
}
</script>
</body>
</html>
